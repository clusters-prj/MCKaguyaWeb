<title>MCツクヨミ サーバー構成</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* Layout: 3 floating planes (自宅 / Cloudflare / 外部データセンター) in one orbitable 3D scene, with a side panel for explanations.
   Proxmox nodes are flat slabs; every LXC container is a translucent outlined box with its services inside.
   Single dark look on purpose: the scene is a night sky for the moon god. */
:root {
  --bg: #0a0d1a;
  --panel: #111630;
  --line: #262d4c;
  --fg: #e6e9f5;
  --muted: #929cc0;
  --moon: #f0d58a;
  --mc: #7fd6ff;
  --db: #f2b84b;
  --ssh: #6fe0a8;
  --proxy: #b9c2e0;
  --cf: #f6821f;
  --font-ui: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-ui);
  font-size: 14px;
  line-height: 1.6;
  padding-inline: 16px;
  padding-block: 12px;
  box-sizing: border-box;
}
#app { display: flex; flex-direction: column; height: 100%; gap: 10px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: .02em; text-wrap: balance; }
h1 small { font-family: var(--font-mono); font-size: 11px; font-weight: 400; color: var(--muted); margin-left: 8px; letter-spacing: .08em; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font: inherit; font-size: 12px; color: var(--fg); background: transparent;
  border: 1px solid var(--line); border-radius: 3px; padding: 3px 10px;
  display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
}
.chip i { width: 18px; height: 3px; border-radius: 2px; background: var(--c); display: inline-block; }
.chip[aria-pressed="false"] { opacity: .4; }
.chip[aria-pressed="false"] i { background: var(--muted); }
.chip:focus-visible, .btn:focus-visible, select:focus-visible { outline: 2px solid var(--moon); outline-offset: 2px; }
main { flex: 1; min-height: 0; display: flex; gap: 12px; }
#stage { position: relative; flex: 1; min-width: 0; min-height: 260px; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: var(--bg); }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#gl:active { cursor: grabbing; }
#hint { position: absolute; left: 10px; bottom: 8px; font-size: 11px; color: var(--muted); pointer-events: none; font-family: var(--font-mono); }
.tools { position: absolute; right: 8px; top: 8px; display: flex; gap: 6px; }
.btn { font: inherit; font-size: 12px; color: var(--fg); background: rgba(17,22,48,.85); border: 1px solid var(--line); border-radius: 3px; padding: 3px 10px; cursor: pointer; }
.btn[aria-pressed="true"] { border-color: var(--moon); color: var(--moon); }
#panel { width: 330px; flex: 0 0 330px; min-width: 0; overflow-y: auto; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); padding: 14px; box-sizing: border-box; }
#panel label { font-size: 11px; color: var(--muted); letter-spacing: .06em; display: block; margin-bottom: 4px; }
select { width: 100%; font: inherit; font-size: 13px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 3px; padding: 5px 6px; margin-bottom: 14px; }
#panel h2 { margin: 0 0 2px; font-size: 17px; text-wrap: balance; }
.tag { display: inline-block; font-family: var(--font-mono); font-size: 11px; color: var(--tagc, var(--moon)); letter-spacing: .06em; margin-bottom: 8px; }
#panel p { margin: 0 0 10px; overflow-wrap: anywhere; }
dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; }
dt { color: var(--muted); font-size: 12px; padding-top: 1px; }
dd { margin: 0; min-width: 0; overflow-wrap: anywhere; font-size: 13px; }
dd code, #panel code { font-family: var(--font-mono); font-size: 12px; color: var(--moon); }
.flows { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 8px; }
.flows li { display: grid; grid-template-columns: 10px 1fr; gap: 10px; }
.flows li b { display: block; width: 4px; height: 100%; min-height: 20px; border-radius: 2px; background: var(--c); }
.flows span { min-width: 0; overflow-wrap: anywhere; font-size: 13px; }
.note { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
@media (max-width: 860px) {
  main { flex-direction: column; }
  #panel { width: auto; flex: 0 0 auto; max-height: 42%; }
  #stage { min-height: 240px; }
  h1 { font-size: 17px; }
}
</style>

<div id="app">
  <header>
    <h1>MCツクヨミ サーバー構成<small>3D MAP</small></h1>
    <div class="chips" id="chips"></div>
  </header>
  <main>
    <div id="stage">
      <canvas id="gl"></canvas>
      <div class="tools">
        <button class="btn" id="spin" aria-pressed="false" type="button">自動回転</button>
        <button class="btn" id="reset" type="button">視点リセット</button>
      </div>
      <div id="hint">ドラッグで回転 / 2本指で移動・拡大 / 部品や線をタップで解説</div>
    </div>
    <aside id="panel" aria-live="polite">
      <label for="pick">部品をえらぶ</label>
      <select id="pick"></select>
      <div id="info"></div>
    </aside>
  </main>
</div>

    var had = pointers[e.pointerId];
    delete pointers[e.pointerId];
    if (had && downInfo && Object.keys(pointers).length === 0) {
      if (downInfo.moved < 6 && performance.now() - downInfo.t < 600) pickAt(e.clientX, e.clientY);
    }
    downInfo = null; pinchDist = 0; pinchMid = null;
  }
  canvas.addEventListener("pointerup", endPointer);
  canvas.addEventListener("pointercancel", endPointer);
  canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  canvas.addEventListener("wheel", function (e) {
    e.preventDefault();
    // トラックパッドの2本指スライドは移動、ピンチ(ctrlKey 付き)とマウスのホイールは拡大縮小
    var trackpadSlide = !e.ctrlKey && (e.deltaX !== 0 || !Number.isInteger(e.deltaY));
    if (trackpadSlide) {
      panBy(-e.deltaX, -e.deltaY);
    } else {
      var f = e.ctrlKey ? 0.01 : 0.0012;
      sph.r = Math.min(120, Math.max(10, sph.r * (1 + e.deltaY * f)));
    }
  }, { passive: false });

  var ray = new THREE.Raycaster();
  function pickAt(cx, cy) {
    var rect = canvas.getBoundingClientRect();
    var ndc = new THREE.Vector2(((cx - rect.left) / rect.width) * 2 - 1, -((cy - rect.top) / rect.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    var hits = ray.intersectObjects(nodeMeshes.concat(hitMeshes), false);
    // services and links win over container frames, frames win over node slabs
    var best = null;
    for (var i = 0; i < hits.length; i++) {
      var u = hits[i].object.userData;
      if (u.kind === "link" && !flowOn[u.flow]) continue;
      if (!best || u.prio < best.prio) best = { id: u.id, prio: u.prio };
      if (u.prio === 0) break;
    }
    select(best ? best.id : null);
  }

  pick.addEventListener("change", function () { select(pick.value || null); });
  document.getElementById("reset").addEventListener("click", function () {
    sph.theta = fitCamera.t0; sph.phi = 1.05; sph.r = fitCamera.r0;
    select(null);
  });
  var spinBtn = document.getElementById("spin");
  spinBtn.addEventListener("click", function () {
    spinOn = !spinOn;
    spinBtn.setAttribute("aria-pressed", String(spinOn));
  });

  /* ---------- loop ---------- */
  function frame(now) {
    var t = reduced ? 0 : now / 1000;
    if (goal) {
      target.lerp(goal, 0.08);
      if (target.distanceTo(goal) < 0.02) goal = null;
    }
    if (spinOn && !reduced && Object.keys(pointers).length === 0) sph.theta += 0.0025;
    linkObjs.forEach(function (o) {
      if (!flowOn[o.def.flow]) return;
      var sel = selected === o.def.id;
      for (var i = 0; i < o.dots.length; i++) {
        var d = o.dots[i];
        var u = (t * o.speed + d.userData.off) % 1;
        d.position.copy(o.curve.getPoint(u));
        d.scale.setScalar(sel ? 1.5 : 1);
      }
    });
    updateCamera();
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  function init() {
    try {
      renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
    } catch (err) {
      stage.innerHTML = '<p style="padding:16px;color:#929cc0">この環境では 3D を表示できませんでした(WebGL が使えません)。</p>';
      return;
    }
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    buildScene();
    applyFlowVisibility();
    fitCamera();
    if (window.ResizeObserver) { new ResizeObserver(fitCamera).observe(stage); } else { window.addEventListener("resize", fitCamera); }
    requestAnimationFrame(frame);
  }

  var fontsReady = (document.fonts && document.fonts.load)
    ? Promise.race([
        Promise.all([document.fonts.load('700 28px "Zen Kaku Gothic New"'), document.fonts.load('400 20px "Zen Kaku Gothic New"')]),
        new Promise(function (r) { setTimeout(r, 1500); })
      ])
    : Promise.resolve();
  fontsReady.then(init, init);
})();
</script>

</body></html>
