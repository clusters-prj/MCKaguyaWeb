<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>再現進捗 - 超かぐや姫！再現プロジェクト</title>
    <style>
        .progress-container {
            margin-bottom: 20px;
        }
        .progress-bar-bg {
            background-color: #e0e0e0;
            border-radius: 8px;
            height: 20px;
            width: 100%;
            overflow: hidden;
        }
        .progress-bar-fill {
            background-color: #4caf50;
            height: 100%;
            text-align: center;
            color: white;
            font-size: 12px;
            line-height: 20px;
        }
    </style>
</head>
<body>
    <!--#include virtual="/header.html" -->
    <main>
        <section id="progress-detail">
            <h2>再現進捗状況</h2>
            <p>プロジェクトの各要素における現在の進捗率です。</p>

            <div class="progress-container">
                <h4>水のライブ会場の再現</h4>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" style="width: 90%;">だいたい終了</div>
                </div>
                <p>大まかにいうと終了</p>

                <h4>ツクヨミタウンの再現</h4>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" style="width: 30%;">そこそこ</div>
                </div>
                <p>第一層大体終了</p>
            </div>
        </section>

        <section id="history">
        <!--#include virtual="/history.html" -->
        </section>
    </main>
</body>
</html>
