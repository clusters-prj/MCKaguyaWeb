<nav>
  <button id="menu-btn" class="menu-btn" aria-label="メニュー開閉">
    <span></span><span></span><span></span>

  <ul id="nav-list">
    <li><a href="/index.shtml">トップ</a></li>

  </ul>

<hr>

<script>
  function applyTheme(theme) {
    const themeLink = document.getElementById('main-style');
    if (!themeLink) return;
    themeLink.href = theme === 'pre' ? '/assets/pre.css' : '/assets/style.css';
    localStorage.setItem('selected-theme', theme);
  }

  document.addEventListener('DOMContentLoaded', function() {
    // ナビゲーションのハイライト
    const currentPath = window.location.pathname;
    const navLinks = document.querySelectorAll('nav a');
    
    navLinks.forEach(link => {
      const href = link.getAttribute('href');
      if (currentPath === href || (currentPath === '/' && href === '/index.shtml')) {
        link.classList.add('active');
      }
    });

    // テーマ切り替え初期化
    const savedTheme = localStorage.getItem('selected-theme') || 'style';
    applyTheme(savedTheme);

    const toggleBtn = document.getElementById('theme-toggle');
    if (toggleBtn) {
      toggleBtn.addEventListener('click', function() {
        const currentTheme = localStorage.getItem('selected-theme') === 'pre' ? 'style' : 'pre';
        applyTheme(currentTheme);
      });
    }

    // モバイルメニューのトグル制御
    const menuBtn = document.getElementById('menu-btn');
    const navList = document.getElementById('nav-list');
    if (menuBtn && navList) {
      menuBtn.addEventListener('click', function() {
        menuBtn.classList.toggle('is-active');
        navList.classList.toggle('is-open');
      });
    }
  });
</script>
