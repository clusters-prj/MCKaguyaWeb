<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/style.css">
    <title>お問い合わせ - 超かぐや姫！再現プロジェクト</title>
    <style>
        .contact-container {
            max-width: 800px;
            margin: 0;
        }
        .contact-method {
            background: #f9f9f9;
            border-left: 5px solid #4caf50;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 4px;
        }
        .contact-method h3 {
            margin-top: 0;
            color: #333;
        }
        .contact-link {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 20px;
            background-color: #4caf50;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        .contact-link:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <!--#include virtual="../templates/header.html" -->
    <main class="contact-container">
        <section id="contact-info">
            <h2>お問い合わせ</h2>
            <p>プロジェクトに関するご質問、協力の申し出、不具合報告などは以下の窓口より受け付けております。</p>

            <div class="contact-method">
                <h3>公式Discordサーバー</h3>
                <p>開発進捗の確認や、リアルタイムでのコミュニケーションが可能です。協力希望の方もこちらへお越しください。</p>
                <a href="https://discord.gg/YzTZNsUMb" class="contact-link">Discordに参加する</a>
            </div>

            <div class="contact-method">
                <h3>メール</h3>
                <p>サーバー管理者キーマへのメールにてお問い合わせください。</p>
                <a href="mailto:milieus-74.arts@icloud.com" class="contact-link">milieus-74.arts@icloud.com</a>
            </div>
        </section>
    </main>
    <script>
      window.addEventListener('load', () => {
        const pathname = window.location.pathname;
        document.querySelectorAll('nav a').forEach(link => {
          const href = link.getAttribute('href');
          if (pathname === href || (pathname === '/' && href === '/index.shtml')) {
            link.classList.add('active');
          }
        });
      });
    </script>
  </body>
</html>
