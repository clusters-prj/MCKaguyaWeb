name: Check

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 翻訳キーの過不足を検出する。
      # 足りないキーは画面に [[key_name]] と出てしまう。
      - name: Check translation keys
        run: npm run check:lang

      - name: Type check
        run: npm run typecheck

      - name: Check JSON & YAML Syntax
        run: |
          set -o pipefail
          python3 -c "import json, glob, sys; [json.load(open(f)) for f in glob.glob('messages/*.json') + glob.glob('data/*.json') + ['package.json', 'tsconfig.json']]" \
          && python3 -c "import yaml, glob, sys; [yaml.safe_load(open(f)) for f in glob.glob('.github/**/*.yml', recursive=True)]"

      - name: Check Web Files Syntax (Prettier)
        run: npx prettier --check "src/**/*.{ts,tsx}" "messages/*.json"

      - name: Build
        run: npm run build
